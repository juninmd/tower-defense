name: Release Drafter

on:
  push:
    branches: []
    # - main
    # - master
  pull_request:
    types: []
    # [opened, reopened, synchronize]

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update_release_draft:
    # Desativado de proposito: sem token com pull-requests: write o
    # release-drafter so gera erro. Mantido valido para religar sem reescrever.
    if: false
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}